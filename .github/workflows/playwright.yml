name: Playwright API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # No cron here. A '*/15' schedule was tried and GitHub dropped most of it —
  # 8 expected runs in a window delivered 1. The 15-minute cadence now comes
  # from ticker.yml, which dispatches this workflow on each quarter-hour.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a cancelled run publishes nothing to the dashboard,
# and serialising also keeps the history.json read-modify-write race-free.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run API tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # continue-on-error keeps the job green: pass/fail is reported on the
      # dashboard and in Slack, not as a red workflow run.
      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://app.kwant.ai' }}
          KWANT_EMAIL: ${{ secrets.KWANT_EMAIL }}
          KWANT_PASSWORD: ${{ secrets.KWANT_PASSWORD }}
        run: npx playwright test

      - name: Build history dashboard
        if: ${{ !cancelled() }}
        run: |
          node .github/scripts/build-dashboard.mjs
          mkdir -p site/report
          cp -r playwright-report/. site/report/ 2>/dev/null || true

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Belt-and-braces copy of the archive, in case a deploy is ever lost.
      - name: Upload run history
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: site/history.json
          retention-days: 90

      - name: Package site for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      # Non-blocking: a repo without Pages enabled still reports test results.
      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Notify Slack on failure
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_URL: ${{ steps.deployment.outputs.page_url || env.PAGES_URL }}
        run: node .github/scripts/slack-notify.mjs

      - name: Summarise
        if: ${{ !cancelled() }}
        run: |
          echo "Test outcome: ${{ steps.tests.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: $PAGES_URL" >> $GITHUB_STEP_SUMMARY
